version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mcp-olist-postgres
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist_owner
      POSTGRES_PASSWORD: olist_owner_password
      POSTGRES_INITDB_ARGS: "--auth-local=trust"
    ports:
      - "5432:5432"
    volumes:
      - olist_data:/var/lib/postgresql/data
      - ./sql/olist_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_owner -d olist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  olist_data:
